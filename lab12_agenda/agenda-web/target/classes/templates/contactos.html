<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Contactos</title>
</head>
<body>
    <h1>Agenda de Contactos</h1>
    <a th:href="@{/nuevo}">+ Agregar contacto</a>

    <p th:if="${#lists.isEmpty(contactos)}">
        No hay contactos guardados todavía.
    </p>

    <table border="1" th:unless="${#lists.isEmpty(contactos)}">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${contactos}">
                <td th:text="${c.nombre}">-</td>
                <td th:text="${c.apellido}">-</td>
                <td th:text="${c.email}">-</td>
                <td th:text="${c.telefono}">-</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
