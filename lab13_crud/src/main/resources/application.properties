# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/agenda?useSSL=false&serverTimezone=America/Monterrey&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Lab13pass!

# JPA / Hibernate
# Nota: en Hibernate 7 (Spring Boot 4) MySQL8Dialect ya no existe;
# MySQLDialect detecta automáticamente la versión del servidor (MySQL 8.x).
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
